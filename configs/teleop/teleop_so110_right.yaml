# Single arm SO110 teleoperation config (right arm only)
# Usage: lerobot-teleoperate --config_path=./configs/teleop_so110_right.yaml

robot:
  type: so110_follower
  port: /dev/tty.usbmodem5AE60803361
  id: right_follower

teleop:
  type: so110_leader
  port: /dev/tty.usbmodem5A680122821
  id: right_leader

display_data: false

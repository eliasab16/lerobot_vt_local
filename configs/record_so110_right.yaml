# Single-arm SO110 recording config (right arm only)
# Usage:
#   lerobot-record --config_path=./configs/record_so110_right.yaml \
#       --dataset.repo_id=<hf_user>/<dataset_name> \
#       --dataset.single_task="Describe the task here"

robot:
  type: so110_follower
  port: /dev/tty.usbmodem5AE60803361
  id: right_follower
  cameras:
    top:
      type: opencv
      index_or_path: 1
      width: 800
      height: 600
      fps: 30
    bottom:
      type: opencv
      index_or_path: 3
      width: 800
      height: 600
      fps: 30

teleop:
  type: so110_leader
  port: /dev/tty.usbmodem5A680122821
  id: right_leader

dataset:
  repo_id: elisdev/so110_right_placeholder
  single_task: "Placeholder task — override with --dataset.single_task=..."
  fps: 30
  num_episodes: 20
  episode_time_s: 30
  reset_time_s: 10

  streaming_encoding: true
  vcodec: auto
  encoder_threads: 2
  encoder_queue_maxsize: 30
  video_encoding_batch_size: 1

  push_to_hub: false
  private: false

display_data: true
play_sounds: true
resume: false

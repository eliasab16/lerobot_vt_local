# Single-arm SO110 recording config (left arm only)
# Usage:
#   lerobot-record --config_path=./configs/record_so110_left.yaml \
#       --dataset.repo_id=<hf_user>/<dataset_name> \
#       --dataset.single_task="Describe the task here"

robot:
  type: so110_follower
  port: /dev/tty.usbmodem5AE60845471
  id: left_follower
  cameras:
    wrist_top:
      type: opencv
      index_or_path: 0
      width: 320
      height: 240
      fps: 30
    wrist_bottom:
      type: opencv
      index_or_path: 1
      width: 320
      height: 240
      fps: 30
    overhead:
      type: opencv
      index_or_path: 2
      width: 320
      height: 240
      fps: 30

teleop:
  type: so110_leader
  port: /dev/tty.usbmodem5AAF2882501
  id: left_leader

dataset:
  repo_id: eliasab16/so110_left_wire_tip_base_1
  root: /Users/elisd/.cache/huggingface/lerobot/eliasab16/so110_left_wire_tip_base_1
  single_task: "insert wire tip into mounted component's hole"
  fps: 30
  num_episodes: 1
  episode_time_s: 100
  reset_time_s: 100

  streaming_encoding: true
  vcodec: auto
  encoder_threads: 2
  encoder_queue_maxsize: 30
  video_encoding_batch_size: 1

  push_to_hub: true
  private: true

display_data: true
# JPEG-compress images before sending to Rerun. Huge bandwidth reduction;
# only affects the viewer, the dataset videos are still encoded from raw frames.
display_compressed_images: false
play_sounds: true
resume: true

# lerobot-teleoperate --config_path=./setup_configs/teleop.yaml

robot:
  type: so101_follower
  port: /dev/tty.usbmodem5A680122821
  id: right_follower
  cameras:
    wrist_top:
      type: opencv
      index_or_path: 0
      width: 800
      height: 600
      fps: 30
    overhead_top:
      type: opencv
      index_or_path: 1
      width: 800
      height: 600
      fps: 30
    wrist_bottom:
      type: opencv
      index_or_path: 2
      width: 800
      height: 600
      fps: 30

teleop:
  type: so101_leader
  port: /dev/tty.usbmodem5A680110941
  id: right_leader

frame_processor:
  type: wire_detection
  config:
    target_colors: ["red"]
    bbox_model_type: "yolo"
    frame_stride: 3
    cameras: ["OpenCVCamera(0)", "OpenCVCamera(1)", "OpenCVCamera(2)"]
display_data: true